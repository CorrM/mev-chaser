[workspace]
resolver = "2"
members = [ # Dont use * for paths in the workspace
    "packages/shared",
    "packages/contracts",
    "packages/amm",
    "packages/mev",
    "packages/evm_simulator",
    "apps/cli",
]

[workspace.dependencies]
anyhow = "1.0"
rayon = "1.5"
reqwest = "0.11"
dashmap = { version = "5.5", features = ["rayon"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tokio-stream = { version = "0.1", features = ['sync'] }
rand = "0.8"

# Logging
colored = "2.1"
log = "0.4"
fern = {version = "0.6", features = ["colored"]}
chrono = "0.4"

# EVM
ethers = { version = "2.0", features = [
    "abigen",
    "ws",
    "rustls",
] }
ethers-core = "2.0"
ethers-providers = { version = "2.0", features = ["ws", "ipc"] }
ethers-contract = { version = "2.0", default-features = false }
bytes = "1.5"
hashbrown = { version = "0.14", features = ["serde"] }
revm = { version = "6.0", default-features = false, features = [
    "std",
    "serde",
    "memory_limit",
    "optional_eip3607",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "ethersdb",
] }

